name: Android CI

on:
  push:
    branches: [main, "feature/**", "fix/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Keep only the newest validation run for each branch/ref.
concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0 ndk;28.2.13676358

      - name: Prepare native PRoot payload
        run: bash scripts/prepare-proot-native.sh

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Run unit tests
        run: gradle --no-daemon testDebugUnitTest

      - name: Run Android lint
        run: gradle --no-daemon lint

      - name: Verify and package installable debug candidate
        run: bash scripts/create-apk-manifest.sh app/build/outputs/apk/debug/app-debug.apk build/release-candidate

      - name: Upload installable debug candidate and manifest
        uses: actions/upload-artifact@v4
        with:
          name: pixeldesk-installable-debug-candidate
          path: build/release-candidate/
          if-no-files-found: error

      - name: Upload PRoot corresponding source and build inputs
        uses: actions/upload-artifact@v4
        with:
          name: pixeldesk-proot-corresponding-source
          path: |
            app/src/main/assets/third-party/proot-corresponding-source.tar
            app/src/main/assets/licenses/
          if-no-files-found: error

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pixeldesk-quality-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results*
          if-no-files-found: ignore
