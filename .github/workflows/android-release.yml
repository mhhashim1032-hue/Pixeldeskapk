name: PIXEL DESK Development Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  development-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Verify and test
        run: |
          gradle --no-daemon testDebugUnitTest
          gradle --no-daemon lint

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Rename APK and generate checksum
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/PIXEL-DESK-development.apk
          cd release
          sha256sum PIXEL-DESK-development.apk > SHA256SUMS.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pixel-desk-development-apk
          path: release/*

      - name: Publish development release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: PIXEL DESK ${{ github.ref_name }} (Development)
          prerelease: true
          generate_release_notes: true
          files: |
            release/PIXEL-DESK-development.apk
            release/SHA256SUMS.txt
